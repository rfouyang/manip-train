# 键与 lerobot-train 命令行参数一一对应（去掉前面的 --）。
lerobot:
  policy.type: act
  policy.chunk_size: 50
  policy.n_action_steps: 50
  policy.optimizer_lr: 1.0e-5
  policy.push_to_hub: false
  batch_size: 8
  steps: 100000
  log_freq: 100
  save_freq: 10000
  eval_steps: 2000
  dataset.eval_split: 0.1
  num_workers: 4
